import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.attributes.Attribute
import org.gradle.api.file.FileSystemLocation
import org.gradle.api.provider.Provider

import java.io.BufferedOutputStream
import java.io.ByteArrayOutputStream
import java.io.FileOutputStream
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream

buildscript {
    ext.kotlin_version = "2.3.20"
    ext.poolakey_version = "2.2.0"
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://plugins.gradle.org/m2/" }
        maven {
            url "https://maven.google.com/"
            name "Google"
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id "com.android.library"
    id "kotlin-android"
}

/**
 * Poolakey and Myket's billing client both package Google's legacy billing AIDL
 * classes. Keep the copy supplied by the host app (or Myket) and remove only
 * those duplicate classes from Poolakey's resolved AAR.
 */
abstract class StripPoolakeyBillingAidlTransform implements TransformAction<TransformParameters.None> {
    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        def inputAar = inputArtifact.get().asFile
        def outputAar = outputs.file(inputAar.name.replace('.aar', '-without-billing-aidl.aar'))

        new ZipFile(inputAar).withCloseable { aar ->
            new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(outputAar))).withCloseable { output ->
                aar.entries().each { aarEntry ->
                    output.putNextEntry(new ZipEntry(aarEntry.name))
                    if (aarEntry.name == 'classes.jar') {
                        new ZipInputStream(aar.getInputStream(aarEntry)).withCloseable { classes ->
                            def transformedJar = new ByteArrayOutputStream()
                            new ZipOutputStream(transformedJar).withCloseable { transformedClasses ->
                                ZipEntry classEntry
                                while ((classEntry = classes.nextEntry) != null) {
                                    if (!classEntry.name.startsWith('com/android/vending/billing/IInAppBillingService')) {
                                        transformedClasses.putNextEntry(new ZipEntry(classEntry.name))
                                        if (!classEntry.directory) classes.transferTo(transformedClasses)
                                        transformedClasses.closeEntry()
                                    }
                                }
                            }
                            output.write(transformedJar.toByteArray())
                        }
                    } else if (!aarEntry.directory) {
                        aar.getInputStream(aarEntry).withCloseable { it.transferTo(output) }
                    }
                    output.closeEntry()
                }
            }
        }
    }
}

def poolakeyAidlStripped = Attribute.of('poolakeyAidlStripped', Boolean)

group 'ir.cafebazaar.flutter_poolakey'
version '2.2.4'

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://plugins.gradle.org/m2/" }
        maven {
            url "https://maven.google.com/"
            name "Google"
        }
    }
}

dependencies {
    attributesSchema {
        attribute(poolakeyAidlStripped)
    }
    components {
        withModule('com.github.cafebazaar.Poolakey:poolakey') {
            allVariants {
                attributes {
                    attribute(poolakeyAidlStripped, false)
                }
            }
        }
    }
    registerTransform(StripPoolakeyBillingAidlTransform) {
        from.attribute(poolakeyAidlStripped, false)
        to.attribute(poolakeyAidlStripped, true)
    }
}

android {
    namespace 'ir.cafebazaar.flutter_poolakey'
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 16
        versionCode 2002001000
        versionName "2.2.4"
    }

    buildTypes {
        debug {
            buildConfigField "String", "POOLAKEY_VERSION", '"' + poolakey_version + '"'
        }
        release {
            buildConfigField "String", "POOLAKEY_VERSION", '"' + poolakey_version + '"'
        }
    }

    dependencies {
        implementation("com.github.cafebazaar.Poolakey:poolakey:$poolakey_version") {
            attributes {
                attribute(poolakeyAidlStripped, true)
            }
        }
    }
}
